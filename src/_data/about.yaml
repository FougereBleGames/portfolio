title: À propos
lead: |
  Je suis Fougere, sûrement le pire développeur de jeux au monde. Et aussi le pire modélisateur 3D. Et peut être même la pire personne pour faire de belles
  animations pour mes personnages.

  Mais un jour, petite Fougere deviendra grande !

  Enfin... c'est ce que je me suis dit il y a 15 ans, quand j'ai commencé le dev.

  Aujourd'hui, je code mes jeux avec Godot, je fait mes modèles 3D avec Blender et mes animations directement dans le moteur de jeu.

  L'objectif à terme est de pouvoir aussi créer mes propres musiques et mes propres sons !
